<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <span>Venue</span>Vista
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to continue to VenueVista
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <p class="register-text">
      Don't have an account?
      <a routerLink="/register">Create Account</a>
    </p>

  </div>

</div>
