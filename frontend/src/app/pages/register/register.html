<div class="register-page">

  <div class="register-card">

    <div class="brand">
      <span>Venue</span>Vista
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Join VenueVista and start booking amazing events
    </p>

    <form (ngSubmit)="register()">

      <div class="form-group">
        <label for="name">Full Name</label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
          required
        />
      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        class="register-button"
        [disabled]="loading"
      >
        {{ loading ? 'Creating Account...' : 'Create Account' }}
      </button>

    </form>

    <p class="login-text">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
